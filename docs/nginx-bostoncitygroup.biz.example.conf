# Nginx — bostoncitygroup.biz (exemplo) — VERSÃO GERAL
# Todo /api/ vai para o Next (3000); Next faz proxy ao backend (3001) com cookie → Bearer.
# Se der erro, use a versão com rotas específicas: docs/nginx-bostoncitygroup.biz.example-rotas-especificas.conf
#
# Bypass CloudFront para login: DNS A auth.bostoncitygroup.biz → EC2; auth em server_name; cert auth; NEXT_PUBLIC_AUTH_API_URL=https://auth.bostoncitygroup.biz no build.
#
server {
    listen 80;
    server_name bostoncitygroup.biz www.bostoncitygroup.biz origin.bostoncitygroup.biz auth.bostoncitygroup.biz;

    # Uploads (mídia, hino MP3 até 15 MB). Deve vir antes de location /api/.
    location ^~ /api/media {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # TODO /api/ → Next (3000). Buffer 16k para respostas grandes (ex.: auth com 3 cookies JWT).
    # client_max_body_size 20m — páginas tenant com muitos módulos (evita 413 ao salvar).
    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # Site (Next)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS — servidor auth (certificado próprio para auth.bostoncitygroup.biz)
# Coloque este server ANTES do server principal.
server {
    listen 443 ssl;
    server_name auth.bostoncitygroup.biz;

    ssl_certificate     /etc/letsencrypt/live/auth.bostoncitygroup.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.bostoncitygroup.biz/privkey.pem;

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS — principal (www, origin)
server {
    listen 443 ssl;
    server_name bostoncitygroup.biz www.bostoncitygroup.biz origin.bostoncitygroup.biz;

    ssl_certificate     /etc/letsencrypt/live/bostoncitygroup.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bostoncitygroup.biz/privkey.pem;

    # Segurança (ajuste CSP se algum recurso externo quebrar)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; connect-src 'self' https: wss:;" always;

    # Uploads (mídia, hino MP3 até 15 MB). Deve vir antes de location /api/.
    location ^~ /api/media {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # TODO /api/ → Next (3000). Buffer 16k para respostas grandes (ex.: auth com 3 cookies JWT).
    # client_max_body_size 20m — páginas tenant com muitos módulos (evita 413 ao salvar).
    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
