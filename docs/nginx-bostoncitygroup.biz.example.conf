# Nginx — bostoncitygroup.biz (exemplo)
# Checklist completo (DNS, Lightsail, cert, Nginx, env, CloudFront): docs/LOGIN_PRODUCAO_CHECKLIST.md
#
# senão o Next não recebe o access_token e /api/me retorna 401.
#
# Bypass CloudFront para login: DNS A auth.bostoncitygroup.biz → EC2; auth em server_name; cert auth; NEXT_PUBLIC_AUTH_API_URL=https://auth.bostoncitygroup.biz no build.
#
server {
    listen 80;
    server_name bostoncitygroup.biz www.bostoncitygroup.biz origin.bostoncitygroup.biz auth.bostoncitygroup.biz;

    # EXCEÇÕES: estas rotas /api são do Next (3000), NÃO do backend (3001)
    location ^~ /api/media/proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        # OBRIGATÓRIO: resposta com 3 cookies JWT (~4–8KB) excede buffer padrão (4–8K)
        # Sem isso: "upstream sent too big header" → 502
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # Rotas públicas do Next (ex.: /api/public/group) — Next faz proxy para o backend
    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # /api/me — Next lê o cookie e envia Authorization ao backend (evita cookie não chegar ao 3001)
    location ^~ /api/me {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # WorkMail — Next faz proxy com path completo (/api/workmail/...) para o backend (Nest usa @Controller('api/workmail'))
    location ^~ /api/workmail/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Vault — Next faz proxy com path completo (/api/vault/...) para o backend (Nest usa @Controller('api/vault'))
    location ^~ /api/vault/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # API REAL (backend)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Site (Next)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS — use o MESMO desenho de locations (auth e media/proxy antes de /api/)
# Servidor auth com certificado PRÓPRIO (evita ERR_CERT_COMMON_NAME_INVALID)
# Coloque este server ANTES do server principal; use os caminhos que o certbot criou para auth.
server {
    listen 443 ssl;
    server_name auth.bostoncitygroup.biz;

    ssl_certificate     /etc/letsencrypt/live/auth.bostoncitygroup.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.bostoncitygroup.biz/privkey.pem;

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

