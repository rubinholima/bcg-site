# Exemplo completo para /etc/nginx/sites-available/bostoncitygroup.biz
# Copie o conteúdo para o servidor e ajuste ssl_certificate* no bloco 443 se precisar.

# HTTP (redirect opcional ou site direto)
server {
    listen 80;
    server_name bostoncitygroup.biz www.bostoncitygroup.biz origin.bostoncitygroup.biz;

    # EXCEÇÕES: estas rotas /api são do Next (3000), NÃO do backend (3001)
    location ^~ /api/media/proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OBRIGATÓRIO: resposta com 3 cookies JWT (~4–8KB) excede buffer padrão (4–8K)
        # Sem isso: "upstream sent too big header" → 502
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # API REAL (backend)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Site (Next)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS — use o MESMO desenho de locations (auth e media/proxy antes de /api/)
server {
    listen 443 ssl;
    server_name bostoncitygroup.biz www.bostoncitygroup.biz origin.bostoncitygroup.biz;

    # Ajuste os caminhos dos certificados conforme seu ambiente (ex.: Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/bostoncitygroup.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bostoncitygroup.biz/privkey.pem;

    location ^~ /api/media/proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OBRIGATÓRIO: resposta com 3 cookies JWT (~4–8KB) excede buffer padrão (4–8K)
        # Sem isso: "upstream sent too big header" → 502
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
