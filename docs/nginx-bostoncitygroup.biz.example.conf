# Arquivo no repo: docs/nginx-bostoncitygroup.biz.example.conf (não abreviar para example.conf)
#
# ========== PASSO A PASSO NO SERVIDOR (use este config do zero) ==========
# 1. Copie este arquivo para o servidor:
#      scp docs/nginx-bostoncitygroup.biz.example.conf ubuntu@SEU_IP:~/bcg-site/
# 2. No servidor, descubra o caminho do certificado SSL:
#      sudo ls /etc/letsencrypt/live/
#    Se aparecer "bostoncitygroup.biz" ou "www.bostoncitygroup.biz", anote.
# 3. Se NÃO existir nenhuma pasta para o domínio, crie o certificado:
#      sudo certbot certonly --nginx -d bostoncitygroup.biz -d www.bostoncitygroup.biz
#    Depois rode de novo: sudo ls /etc/letsencrypt/live/
# 4. Instale o config e ajuste as 2 linhas do certificado no bloco 443 (linhas ~92-93):
#      sudo cp ~/bcg-site/nginx-bostoncitygroup.biz.example.conf /etc/nginx/sites-available/bostoncitygroup.biz
#      sudo nano /etc/nginx/sites-available/bostoncitygroup.biz
#    Troque "bostoncitygroup.biz" nas linhas ssl_certificate e ssl_certificate_key
#    pela pasta que apareceu no passo 2 (ex.: www.bostoncitygroup.biz).
# 5. Ative e recarregue:
#      sudo ln -sf /etc/nginx/sites-available/bostoncitygroup.biz /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# ========== FIM DO PASSO A PASSO ==========
#
# Exemplo completo para /etc/nginx/sites-available/bostoncitygroup.biz
# Copie o conteúdo para o servidor. Ajuste ssl_certificate no bloco 443 se a pasta do cert for outra (ver passo a passo acima).
#
# DEPLOY: Após alterar no servidor: sudo nginx -t && sudo systemctl reload nginx
#
# Obrigatório: location ^~ /api/public/ deve apontar para 3000 (Next), senão
# /api/public/group retorna 404 e a página de login quebra; session_expired pode aparecer.
# Obrigatório: proxy_set_header Cookie $http_cookie nas locations que vão para 3000 (auth, public, me),
# senão o Next não recebe o access_token e /api/me retorna 401.
#
# Bypass CloudFront para login: DNS A auth.bostoncitygroup.biz → EC2; auth em server_name; cert auth; NEXT_PUBLIC_AUTH_API_URL=https://auth.bostoncitygroup.biz no build.

# HTTP (redirect opcional ou site direto)
server {
    listen 80;
    server_name bostoncitygroup.biz www.bostoncitygroup.biz origin.bostoncitygroup.biz auth.bostoncitygroup.biz;

    # EXCEÇÕES: estas rotas /api são do Next (3000), NÃO do backend (3001)
    location ^~ /api/media/proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        # OBRIGATÓRIO: resposta com 3 cookies JWT (~4–8KB) excede buffer padrão (4–8K)
        # Sem isso: "upstream sent too big header" → 502
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # Rotas públicas do Next (ex.: /api/public/group) — Next faz proxy para o backend
    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # /api/me — Next lê o cookie e envia Authorization ao backend (evita cookie não chegar ao 3001)
    location ^~ /api/me {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # API REAL (backend)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Site (Next)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS — use o MESMO desenho de locations (auth e media/proxy antes de /api/)
# No servidor: mantenha as linhas ssl_certificate e ssl_certificate_key que já funcionam (não use as abaixo se o caminho for outro).
server {
    listen 443 ssl;
    server_name bostoncitygroup.biz www.bostoncitygroup.biz origin.bostoncitygroup.biz auth.bostoncitygroup.biz;

    # Use no servidor os caminhos que já estavam no seu config (ex.: Let's Encrypt ou outro). Exemplo apenas:
    ssl_certificate     /etc/letsencrypt/live/bostoncitygroup.biz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bostoncitygroup.biz/privkey.pem;

    location ^~ /api/media/proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        # OBRIGATÓRIO: resposta com 3 cookies JWT (~4–8KB) excede buffer padrão (4–8K)
        # Sem isso: "upstream sent too big header" → 502
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # Rotas públicas do Next (ex.: /api/public/group) — Next faz proxy para o backend
    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # /api/me — Next lê o cookie e envia Authorization ao backend (evita cookie não chegar ao 3001)
    location ^~ /api/me {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
